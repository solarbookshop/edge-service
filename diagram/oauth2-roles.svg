<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <!-- Arrowhead for relationship lines -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a0a0a0"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .title {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
    }
    .meta {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      fill: #000000;
      text-anchor: middle;
    }
    .desc {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      fill: #000000;
      text-anchor: middle;
    }
    .label {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 5px;
      paint-order: stroke fill;
      text-anchor: middle;
    }
    .tag-text {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      fill: #111111;
      text-anchor: middle;
    }
    .box {
      fill: #ffffff;
      stroke: #c0c0c0;
      stroke-width: 1.5px;
    }
    .user-shape {
      fill: #cccccc;
      stroke: #a3a3a3;
      stroke-width: 1.5px;
    }
    .tag-bg {
      fill: #dae8f5;
      stroke: #9fb3cf;
      stroke-width: 1px;
    }
    .dashed-line {
      stroke: #a0a0a0;
      stroke-width: 1.5px;
      stroke-dasharray: 7, 5;
      fill: none;
    }
    .boundary {
      fill: none;
      stroke: #b4b4b4;
      stroke-width: 1.5px;
      stroke-dasharray: 10, 6;
    }
    .boundary-text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #666666;
      text-anchor: end;
    }
  </style>

  <!-- Solid white background for consistent viewing in dark modes -->
  <rect width="100%" height="100%" class="bg" />

  <!-- System Boundary -->
  <rect x="320" y="20" width="650" height="740" rx="4" class="boundary" />
  <text x="960" y="730" class="boundary-text" font-size="16" font-weight="bold">Solar Bookshop</text>
  <text x="960" y="750" class="boundary-text" font-size="14">[Software System]</text>

  <!-- ================= RELATIONSHIP LINES ================= -->

  <!-- User -> Edge Service -->
  <line x1="245" y1="385" x2="350" y2="385" class="dashed-line" marker-end="url(#arrow)"/>

  <!-- User -> Keycloak -->
  <line x1="245" y1="410" x2="350" y2="620" class="dashed-line" marker-end="url(#arrow)"/>

  <!-- Edge Service -> Solar UI -->
  <line x1="455" y1="310" x2="455" y2="200" class="dashed-line" marker-end="url(#arrow)"/>

  <!-- Edge Service -> Catalog Service -->
  <line x1="560" y1="365" x2="745" y2="255" class="dashed-line" marker-end="url(#arrow)"/>

  <!-- Edge Service -> Order Service -->
  <line x1="560" y1="405" x2="745" y2="495" class="dashed-line" marker-end="url(#arrow)"/>

  <!-- Edge Service -> Keycloak -->
  <line x1="455" y1="460" x2="455" y2="565" class="dashed-line" marker-end="url(#arrow)"/>

  <!-- Order Service -> Catalog Service -->
  <!-- Positioned to the right side of the boxes to match the original layout -->
  <line x1="900" y1="420" x2="900" y2="315" class="dashed-line" marker-end="url(#arrow)"/>

  <!-- ================= NODES ================= -->

  <!-- User Person Node -->
  <rect x="40" y="320" width="205" height="130" rx="12" class="user-shape" />
  <circle cx="142.5" cy="280" r="40" class="user-shape" />
  <text x="142.5" y="345" class="title">User</text>
  <text x="142.5" y="365" class="meta">[Person]</text>
  <text x="142.5" y="405" class="desc">A customer or an employee</text>
  <text x="142.5" y="425" class="desc">of the bookshop</text>

  <!-- User Tag: OAuth2 user -->
  <path d="M 25 435 L 130 435 L 120 460 L 15 460 Z" class="tag-bg" />
  <text x="72.5" y="452" class="tag-text">OAuth2 user</text>

  <!-- Solar UI Node -->
  <rect x="350" y="45" width="210" height="155" rx="12" class="box" />
  <text x="455" y="85" class="title">Solar UI</text>
  <text x="455" y="105" class="meta">[Container: NGINX]</text>
  <text x="455" y="150" class="desc">Provides an SPA to users</text>

  <!-- Edge Service Node -->
  <rect x="350" y="310" width="210" height="150" rx="12" class="box" />
  <text x="455" y="350" class="title">Edge Service</text>
  <text x="455" y="370" class="meta">[Container: Spring Boot]</text>
  <text x="455" y="415" class="desc">Provides API gateway and</text>
  <text x="455" y="435" class="desc">cross-cutting concerns</text>

  <!-- Edge Service Tag: OAuth2 Client -->
  <path d="M 340 445 L 450 445 L 440 470 L 330 470 Z" class="tag-bg" />
  <text x="390" y="462" class="tag-text">OAuth2 Client</text>

  <!-- Keycloak Node -->
  <rect x="350" y="565" width="210" height="150" rx="12" class="box" />
  <text x="455" y="605" class="title">Keycloak</text>
  <text x="455" y="625" class="meta">[Container: Quarkus]</text>
  <text x="455" y="670" class="desc">Provides identity and access</text>
  <text x="455" y="690" class="desc">management</text>

  <!-- Keycloak Tag: OAuth2 Authorization Server -->
  <path d="M 340 700 L 530 700 L 520 725 L 330 725 Z" class="tag-bg" />
  <text x="430" y="717" class="tag-text">OAuth2 Authorization Server</text>

  <!-- Catalog Service Node -->
  <rect x="745" y="165" width="210" height="150" rx="12" class="box" />
  <text x="850" y="205" class="title">Catalog Service</text>
  <text x="850" y="225" class="meta">[Container: Spring Boot]</text>
  <text x="850" y="270" class="desc">Provides functionality for</text>
  <text x="850" y="290" class="desc">managing books</text>

  <!-- Catalog Service Tag: OAuth2 Resource Server -->
  <path d="M 735 300 L 895 300 L 885 325 L 725 325 Z" class="tag-bg" />
  <text x="810" y="317" class="tag-text">OAuth2 Resource Server</text>

  <!-- Order Service Node -->
  <rect x="745" y="420" width="210" height="150" rx="12" class="box" />
  <text x="850" y="460" class="title">Order Service</text>
  <text x="850" y="480" class="meta">[Container: Spring Boot]</text>
  <text x="850" y="525" class="desc">Provides functionality for</text>
  <text x="850" y="545" class="desc">purchasing books</text>

  <!-- Order Service Tag: OAuth2 Resource Server -->
  <path d="M 735 555 L 895 555 L 885 580 L 725 580 Z" class="tag-bg" />
  <text x="810" y="572" class="tag-text">OAuth2 Resource Server</text>

  <!-- ================= LINE LABELS ================= -->
  <!-- Placed at the end to ensure they render over the dashed lines -->

  <text x="297" y="380" class="label">Uses</text>

  <text x="297" y="515" class="label">Uses</text>

  <text x="455" y="260" class="label">Delivers to the user's web browser</text>

  <text x="652" y="295" class="label">Forwards requests to</text>
  <text x="652" y="315" class="label">[REST/HTTP]</text>

  <text x="652" y="445" class="label">Forwards requests to</text>
  <text x="652" y="465" class="label">[REST/HTTP]</text>

  <text x="455" y="505" class="label">Delegates authentication and</text>
  <text x="455" y="525" class="label">token management to</text>

  <text x="900" y="360" class="label">Checks book details</text>
  <text x="900" y="380" class="label">[REST/HTTP]</text>

</svg>