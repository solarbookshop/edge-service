<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 690" width="1180" height="690">
        <defs>
            <!-- Standard Arrowhead for connection lines -->
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#222" />
            </marker>
        </defs>

        <style>
            .bold { font-weight: bold; }
            .italic { font-style: italic; }
            .font-sm { font-size: 14px; }
            .font-md { font-size: 16px; }
            .font-lg { font-size: 20px; }
            text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #111; }

            .k8s-box { fill: #ffffff; stroke: #111; stroke-width: 1.5; }
            .ingress-box { fill: #97c297; stroke: #6b8f6b; stroke-width: 1.5; }
            .service-box { fill: #f2a8a8; stroke: #c27a7a; stroke-width: 1.5; }
            .pod-outer { fill: #f4f5f7; stroke: #a0a2a6; stroke-width: 1.5; }
            .pod-inner { fill: #bcd3ee; stroke: #7a9ecc; stroke-width: 1.5; }
            .port-box { fill: #fceda8; stroke: #cca643; stroke-width: 1.5; }

            .line-arrow { stroke: #222; stroke-width: 1.5; }
        </style>

        <!-- Kubernetes Cluster Boundary -->
        <rect x="20" y="20" width="1140" height="560" class="k8s-box" rx="2" />
        <text x="590" y="550" class="bold font-lg" text-anchor="middle">Kubernetes cluster</text>

        <!-- ============================== -->
        <!-- COMPONENTS                     -->
        <!-- ============================== -->

        <!-- Ingress -->
        <rect x="50" y="210" width="140" height="80" class="ingress-box" rx="8" />
        <text x="120" y="245" class="bold font-md" text-anchor="middle">Ingress</text>
        <text x="120" y="265" class="italic font-md" text-anchor="middle">solar-ingress</text>

        <!-- Service 1 (edge-service) -->
        <rect x="280" y="150" width="80" height="200" class="service-box" rx="8" />
        <rect x="270" y="190" width="20" height="40" class="port-box" rx="2" />
        <text x="280" y="210" class="font-sm" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 280 210)">80</text>
        <!-- Rotated Text: Starts bottom to top -->
        <text x="330" y="250" class="bold font-md" text-anchor="middle" transform="rotate(-90 330 250)">Service</text>
        <text x="310" y="250" class="font-md" text-anchor="middle" transform="rotate(-90 310 250)">edge-service</text>

        <!-- Pod 1 (Edge Service container) -->
        <rect x="420" y="160" width="220" height="180" class="pod-outer" rx="12" />
        <text x="530" y="320" class="bold font-md" text-anchor="middle">Pod</text>
        <rect x="440" y="180" width="180" height="110" class="pod-inner" rx="8" />
        <rect x="430" y="210" width="20" height="40" class="port-box" rx="2" />
        <text x="440" y="230" class="font-sm" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 440 230)">9000</text>
        <text x="530" y="225" class="font-md" text-anchor="middle">Edge Service</text>
        <text x="530" y="245" class="font-md" text-anchor="middle">container</text>

        <!-- Service 2 (catalog-service) -->
        <rect x="750" y="50" width="80" height="180" class="service-box" rx="8" />
        <rect x="740" y="110" width="20" height="40" class="port-box" rx="2" />
        <text x="750" y="130" class="font-sm" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 750 130)">80</text>
        <text x="800" y="140" class="bold font-md" text-anchor="middle" transform="rotate(-90 800 140)">Service</text>
        <text x="780" y="140" class="font-md" text-anchor="middle" transform="rotate(-90 780 140)">catalog-service</text>

        <!-- Pod 2 (Catalog Service container) -->
        <rect x="880" y="50" width="220" height="150" class="pod-outer" rx="12" />
        <text x="990" y="190" class="bold font-md" text-anchor="middle">Pod</text>
        <rect x="900" y="70" width="180" height="100" class="pod-inner" rx="8" />
        <rect x="890" y="95" width="20" height="40" class="port-box" rx="2" />
        <text x="900" y="115" class="font-sm" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 900 115)">9001</text>
        <text x="990" y="110" class="font-md" text-anchor="middle">Catalog Service</text>
        <text x="990" y="130" class="font-md" text-anchor="middle">container</text>

        <!-- Service 3 (order-service) -->
        <rect x="750" y="310" width="80" height="180" class="service-box" rx="8" />
        <rect x="740" y="370" width="20" height="40" class="port-box" rx="2" />
        <text x="750" y="390" class="font-sm" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 750 390)">80</text>
        <text x="800" y="400" class="bold font-md" text-anchor="middle" transform="rotate(-90 800 400)">Service</text>
        <text x="780" y="400" class="font-md" text-anchor="middle" transform="rotate(-90 780 400)">order-service</text>

        <!-- Pod 3 (Order Service container) -->
        <rect x="880" y="310" width="220" height="150" class="pod-outer" rx="12" />
        <text x="990" y="450" class="bold font-md" text-anchor="middle">Pod</text>
        <rect x="900" y="330" width="180" height="100" class="pod-inner" rx="8" />
        <rect x="890" y="355" width="20" height="40" class="port-box" rx="2" />
        <text x="900" y="375" class="font-sm" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 900 375)">9002</text>
        <text x="990" y="370" class="font-md" text-anchor="middle">Order Service</text>
        <text x="990" y="390" class="font-md" text-anchor="middle">container</text>


        <!-- ============================== -->
        <!-- CONNECTIONS & ARROWS           -->
        <!-- ============================== -->

        <!-- Accesses (Internet -> Ingress) -->
        <line x1="120" y1="585" x2="120" y2="298" class="line-arrow" marker-end="url(#arrow)" />
        <text x="135" y="450" class="font-md">Accesses</text>

        <!-- Ingress -> edge-service (Routes to) -->
        <line x1="190" y1="250" x2="280" y2="250" class="line-arrow" marker-end="url(#arrow)" />
        <text x="226" y="230" class="font-sm" text-anchor="middle">Routes</text>
        <text x="226" y="246" class="font-sm" text-anchor="middle">to</text>

        <!-- Edge Pod -> edge-service (Exposed by) -->
        <line x1="420" y1="250" x2="360" y2="250" class="line-arrow" marker-end="url(#arrow)" />
        <text x="394" y="232" class="font-sm" text-anchor="middle">Exposed</text>
        <text x="394" y="248" class="font-sm" text-anchor="middle">by</text>

        <!-- Edge Pod -> catalog-service (Routes to) -->
        <line x1="620" y1="230" x2="732" y2="130" class="line-arrow" marker-end="url(#arrow)" />
        <text x="670" y="165" class="font-sm" text-anchor="middle">Routes</text>
        <text x="670" y="181" class="font-sm" text-anchor="middle">to</text>

        <!-- Edge Pod -> order-service (Routes to) -->
        <line x1="620" y1="260" x2="732" y2="390" class="line-arrow" marker-end="url(#arrow)" />
        <text x="670" y="310" class="font-sm" text-anchor="middle">Routes</text>
        <text x="670" y="326" class="font-sm" text-anchor="middle">to</text>

        <!-- Catalog Pod -> catalog-service (Exposed by) -->
        <line x1="880" y1="125" x2="838" y2="125" class="line-arrow" marker-end="url(#arrow)" />
        <text x="859" y="107" class="font-sm" text-anchor="middle">Exposed</text>
        <text x="859" y="123" class="font-sm" text-anchor="middle">by</text>

        <!-- Order Pod -> order-service (Exposed by) -->
        <line x1="880" y1="385" x2="838" y2="385" class="line-arrow" marker-end="url(#arrow)" />
        <text x="859" y="367" class="font-sm" text-anchor="middle">Exposed</text>
        <text x="859" y="383" class="font-sm" text-anchor="middle">by</text>


        <!-- ============================== -->
        <!-- EXTERNAL ASSETS (Internet)     -->
        <!-- ============================== -->

        <g id="internet-globe">
            <circle cx="120" cy="630" r="35" fill="#F39C12" />
            <ellipse cx="120" cy="630" rx="15" ry="35" fill="none" stroke="#fff" stroke-width="2" />
            <ellipse cx="120" cy="630" rx="35" ry="15" fill="none" stroke="#fff" stroke-width="2" />
            <line x1="85" y1="630" x2="155" y2="630" stroke="#fff" stroke-width="2" />
            <line x1="120" y1="595" x2="120" y2="665" stroke="#fff" stroke-width="2" />
        </g>
        <text x="175" y="635" class="bold font-md" style="fill:#F39C12;">Internet</text>

    </svg>